[package]
name = "lantern-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lantern-core = { workspace = true }
lantern-system = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }
tokio = { version = "1", features = ["process", "time", "sync", "rt", "rt-multi-thread", "macros", "net", "io-util", "fs", "signal"] }
tokio-util = "0.7"
rustix = { version = "1.1", features = ["net", "param", "process"] }
tracing = "0.1"
toml_edit = "0.23"
globset = "0.4"
walkdir = "2"
sha2 = "0.11"
async-trait = "0.1"
axum = "0.8"
async-stream = "0.3"
futures-util = "0.3"
percent-encoding = "2"
serde_urlencoded = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# Network subsystem
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
getrandom = "0.4"
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-streamable-http-server"] }

libc = "0.2"
serde-saphyr = "=2.1.1"
base64 = "0.23"

[dev-dependencies]
lantern-client = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["test-util"] }
lantern-cli = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
tempfile = "3"
