[package]
name = "lantern-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lantern-core = { workspace = true }
lantern-client = { workspace = true }
lantern-cli = { workspace = true }
iced = { version = "=0.14.0", features = ["tokio", "markdown", "advanced"] }
lucide-icons = { version = "1.70", features = ["iced"] }
ksni = "0.3.7"
zbus = "5.19"
notify-rust = "4.18"
open = "5"
eventsource-stream = "0.2"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
iced_test = "0.14"
tempfile = "3"
